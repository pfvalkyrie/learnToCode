<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Brick Breaker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(circle at 50% 20%, #1a0d2e 0%, #0d0818 60%, #080510 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #f0e6ff;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      font-size: clamp(1.1rem, 5vw, 2.1rem);
      letter-spacing: 6px;
      margin-bottom: 10px;
      color: #ffb3e6;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255, 130, 210, 0.8), 0 0 40px rgba(255, 100, 200, 0.3);
    }

    #hud {
      display: flex;
      gap: clamp(14px, 5vw, 48px);
      margin-bottom: 10px;
      font-size: clamp(0.7rem, 2.6vw, 1rem);
      letter-spacing: 2px;
    }

    #hud span { color: #c084e8; }
    #hud b    { color: #ffe6f9; }

    #btnSound {
      background: #1a0d2e;
      color: #b8ffea;
      border: 1px solid #4a7a6a;
      border-radius: 8px;
      font-family: inherit;
      font-size: clamp(0.6rem, 2vw, 0.78rem);
      letter-spacing: 1px;
      padding: 3px 10px;
      cursor: pointer;
    }
    #btnSound.off { color: #7a5a8a; border-color: #3a2a4a; }

    canvas {
      display: block;
      background: #080510;
      border: 2px solid #9b30c8;
      border-radius: 6px;
      box-shadow: 0 0 30px rgba(200, 100, 255, 0.4), 0 0 80px rgba(255, 100, 200, 0.15);
      width: min(480px, 96vw);
      height: auto;
      touch-action: none;
    }

    #message {
      margin-top: 12px;
      font-size: clamp(0.75rem, 2.6vw, 1.05rem);
      letter-spacing: 2px;
      min-height: 1.4em;
      color: #b8ffea;
      text-shadow: 0 0 10px rgba(100, 255, 210, 0.6);
      text-align: center;
      padding: 0 10px;
    }

    #hint {
      margin-top: 6px;
      font-size: clamp(0.55rem, 1.9vw, 0.72rem);
      color: #7a5a8a;
      letter-spacing: 1px;
      text-align: center;
    }

    #pad {
      display: flex;
      gap: 22px;
      margin-top: 16px;
    }

    #pad button {
      background: #1a0d2e;
      color: #e0b0ff;
      border: 2px solid #7a30b0;
      border-radius: 12px;
      font-size: 1.5rem;
      padding: 14px 30px;
      cursor: pointer;
      touch-action: none;
      transition: background 0.1s, transform 0.05s;
    }
    #pad button:active { background: #3a1060; transform: translateY(1px); }

    #btnGo {
      background: #8b1a6e;
      color: #ffe6f9;
      border-color: #ff80d0;
      font-size: 0.95rem;
      letter-spacing: 2px;
      min-width: 100px;
      text-shadow: 0 0 8px rgba(255, 150, 220, 0.8);
    }
    #btnGo:active { background: #c0307a; }
  </style>
</head>
<body>
  <h1>Brick&nbsp;Breaker</h1>

  <div id="hud">
    <div><span>SCORE </span><b id="scoreEl">0</b></div>
    <div><span>LEVEL </span><b id="levelEl">1</b></div>
    <div><span>LIVES </span><b id="livesEl">3</b></div>
    <button id="btnSound" aria-label="Toggle sound">&#9834; ON</button>
  </div>

  <canvas id="game" width="480" height="640"></canvas>

  <div id="message">Press SPACE or tap LAUNCH to start</div>
  <div id="hint">Move: mouse / arrows / ◀ ▶ &nbsp;|&nbsp; Launch: SPACE / tap</div>

  <div id="pad">
    <button id="btnLeft">&#9664;</button>
    <button id="btnGo">LAUNCH</button>
    <button id="btnRight">&#9654;</button>
  </div>

  <script>
  "use strict";

  // ── Canvas ────────────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ── Tunables ──────────────────────────────────────────────────────
  const PADDLE_W = 86, PADDLE_H = 14, PADDLE_Y = H - 44, PADDLE_SPD = 7;
  const BALL_R = 7;
  const BASE_SPD = 5.2, SPD_MAX = 11, SPD_GAIN = 1.015;
  const TRAIL_LEN = 7;   // how many past positions the ball trail remembers

  const COLS = 9, ROWS = 6;
  const BRICK_PAD = 6, BRICK_TOP = 64;
  const BRICK_W = (W - BRICK_PAD * (COLS + 1)) / COLS;
  const BRICK_H = 22;

  // Brick colours indexed by hp (1..4) — pastel neon palette
  const HP_HUE = [0, 168, 270, 18, 318]; // index 1..4: mint, lavender, peach, hot-pink

  // ── Power-ups ─────────────────────────────────────────────────────
  const PU = {
    multi:  { label: 'M', hue: 280, good: true  },
    wide:   { label: 'W', hue: 155, good: true  },
    slow:   { label: 'S', hue: 195, good: true  },
    life:   { label: '+', hue: 330, good: true  },
    force:  { label: 'F', hue: 240, good: true  },
    aim:    { label: 'A', hue: 50,  good: true  },
    narrow: { label: 'N', hue: 18,  good: false },
    fast:   { label: 'X', hue: 45,  good: false },
  };
  const PU_KEYS = Object.keys(PU);
  const PU_WEIGHTS = { multi: 4, wide: 4, slow: 3, life: 1, force: 2, aim: 3, narrow: 3, fast: 3 };
  const PU_W = 20, PU_H = 20, PU_FALL = 2.0, PU_DROP_CHANCE = 0.26;
  const WIDE_FRAMES = 600, NARROW_FRAMES = 480;
  const FORCE_MS_HUE = 270;

  // ── State ─────────────────────────────────────────────────────────
  let state = 'idle';            // idle | ready | playing | dead | win
  let score = 0, lives = 3, level = 1;
  let paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
  let balls = [];
  let bricks = [];
  let powerups = [];
  let particles = [];
  let keys = {};
  let pointerX = null;
  let fx = { wide: 0, narrow: 0, force: false, sticky: false };
  let shakeFrames = 0, shakeAmt = 0;
  let combo = 0;                 // bricks cleared since last paddle touch
  let floaters = [];             // floating "+score" / "xCombo" text
  let bear = { type: 'idle', life: 0 };   // reactive mascot mood
  let aim = null;                // { b, angle } while a ball is stuck for aiming

  // ── Sound (Web Audio synthesis) ───────────────────────────────────
  let soundOn = true;
  let audioCtx = null;
  function playTone(freq, dur, type = 'sine', vol = 0.05) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { soundOn = false; }
  }

  function bearReact(type) { bear = { type, life: 1 }; }

  function addFloater(text, x, y, hue) {
    floaters.push({ text, x, y, hue, life: 1 });
  }

  // ── Factory helpers ───────────────────────────────────────────────
  function newBall(x, y, vx, vy, launched) {
    return { x, y, vx, vy, r: BALL_R, launched: !!launched, trail: [] };
  }

  function restingBall() {
    return newBall(paddle.x + paddle.w / 2, PADDLE_Y - BALL_R - 1, 0, 0, false);
  }

  function buildBricks(lvl) {
    const list = [];
    const maxHp = Math.min(1 + Math.floor((lvl - 1) / 1), 4);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        // leave occasional gaps on higher levels for variety
        if (lvl > 2 && Math.random() < 0.08) continue;
        const hp = Math.max(1, Math.min(maxHp, ROWS - r >= ROWS - 1 ? 1 : Math.ceil((ROWS - r) / 2)));
        list.push({
          x: BRICK_PAD + c * (BRICK_W + BRICK_PAD),
          y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
          w: BRICK_W, h: BRICK_H,
          col: c, row: r,
          hp, maxHp: hp,
          alive: true,
          bomb: Math.random() < 0.11,
        });
      }
    }
    return list;
  }

  function curSpeed() { return BASE_SPD + (level - 1) * 0.4; }

  // ── Game lifecycle ────────────────────────────────────────────────
  function startGame() {
    score = 0; lives = 3; level = 1;
    resetForLevel();
    state = 'ready';
    showMsg('Press SPACE or tap LAUNCH');
    updateHUD();
    updateGoBtn();
  }

  function resetForLevel() {
    paddle.w = PADDLE_W;
    paddle.x = W / 2 - paddle.w / 2;
    bricks = buildBricks(level);
    powerups = [];
    particles = [];
    floaters = [];
    fx = { wide: 0, narrow: 0, force: false, sticky: false };
    aim = null;
    combo = 0;
    balls = [restingBall()];
    shakeFrames = 0;
  }

  function loseLife() {
    lives--;
    updateHUD();
    powerups = [];
    fx = { wide: 0, narrow: 0, force: false, sticky: false };
    aim = null;
    combo = 0;
    paddle.w = PADDLE_W;
    bearReact('sad');
    playTone(140, 0.35, 'sawtooth', 0.06);
    if (lives <= 0) {
      state = 'dead';
      showMsg('GAME OVER — press LAUNCH to restart');
      playTone(90, 0.5, 'sawtooth', 0.06);
    } else {
      state = 'ready';
      balls = [restingBall()];
      showMsg('Ball lost — press LAUNCH');
    }
    updateGoBtn();
  }

  function launch() {
    if (state === 'idle' || state === 'dead' || state === 'win') {
      startGame();
      return;
    }
    // Fire an aimed shot from a ball stuck on the paddle (Aim power-up)
    if (aim) {
      const b = aim.b;
      b.vx = Math.cos(aim.angle) * aim.spd;
      b.vy = Math.sin(aim.angle) * aim.spd;
      b.launched = true;
      aim = null;
      bearReact('happy');
      playTone(520, 0.12, 'triangle');
      return;
    }
    if (state === 'ready') {
      const b = balls[0];
      const spd = curSpeed();
      const hit = (b.x - paddle.x) / paddle.w;          // 0..1
      const angle = -Math.PI / 2 + (hit - 0.5) * Math.PI * 0.6;
      b.vx = Math.cos(angle) * spd;
      b.vy = Math.sin(angle) * spd;
      b.launched = true;
      state = 'playing';
      clearMsg();
      playTone(420, 0.1, 'triangle');
      updateGoBtn();
    }
  }

  // ── Power-up logic ────────────────────────────────────────────────
  function pickPowerup() {
    const total = PU_KEYS.reduce((s, k) => s + PU_WEIGHTS[k], 0);
    let r = Math.random() * total;
    for (const k of PU_KEYS) { r -= PU_WEIGHTS[k]; if (r <= 0) return k; }
    return PU_KEYS[0];
  }

  function maybeDropPowerup(brick) {
    if (Math.random() > PU_DROP_CHANCE) return;
    const type = pickPowerup();
    powerups.push({
      type,
      x: brick.x + brick.w / 2 - PU_W / 2,
      y: brick.y + brick.h / 2,
    });
  }

  function applyPowerup(type) {
    spawnBurst(paddle.x + paddle.w / 2, PADDLE_Y, PU[type].hue, 14);
    bearReact(PU[type].good ? 'happy' : 'sad');
    playTone(PU[type].good ? 600 : 240, 0.16, 'triangle', 0.05);
    switch (type) {
      case 'multi': {
        const extra = [];
        for (const b of balls) {
          if (!b.launched) continue;
          const spd = Math.hypot(b.vx, b.vy) || curSpeed();
          const base = Math.atan2(b.vy, b.vx);
          for (const da of [-0.4, 0.4]) {
            extra.push(newBall(b.x, b.y, Math.cos(base + da) * spd, Math.sin(base + da) * spd, true));
          }
        }
        balls = balls.concat(extra).slice(0, 9);
        break;
      }
      case 'wide':
        fx.wide = WIDE_FRAMES; fx.narrow = 0;
        setPaddleWidth(Math.round(PADDLE_W * 1.6));
        break;
      case 'narrow':
        fx.narrow = NARROW_FRAMES; fx.wide = 0;
        setPaddleWidth(Math.round(PADDLE_W * 0.6));
        break;
      case 'slow':
        for (const b of balls) scaleBall(b, 0.75);
        break;
      case 'fast':
        for (const b of balls) scaleBall(b, 1.3);
        break;
      case 'life':
        lives++; updateHUD();
        break;
      case 'force':
        fx.force = true;
        break;
      case 'aim':
        fx.sticky = true;
        break;
    }
  }

  function setPaddleWidth(w) {
    const cx = paddle.x + paddle.w / 2;
    paddle.w = w;
    paddle.x = Math.max(0, Math.min(W - w, cx - w / 2));
  }

  function scaleBall(b, factor) {
    if (!b.launched) return;
    const cur = Math.hypot(b.vx, b.vy);
    if (cur === 0) return;
    const nxt = Math.max(2.5, Math.min(SPD_MAX, cur * factor));
    b.vx = (b.vx / cur) * nxt;
    b.vy = (b.vy / cur) * nxt;
  }

  function nudge(b) {
    const cur = Math.hypot(b.vx, b.vy);
    if (cur === 0 || cur >= SPD_MAX) return;
    const nxt = Math.min(cur * SPD_GAIN, SPD_MAX);
    b.vx = (b.vx / cur) * nxt;
    b.vy = (b.vy / cur) * nxt;
  }

  // ── Bomb chain reaction ───────────────────────────────────────────
  function detonate(origin) {
    const queue = [origin];
    const hit = new Set([origin]);
    while (queue.length) {
      const cur = queue.shift();
      for (const o of bricks) {
        if (!o.alive || hit.has(o)) continue;
        if (Math.abs(o.col - cur.col) <= 1 && Math.abs(o.row - cur.row) <= 1) {
          o.alive = false;
          hit.add(o);
          spawnBreak(o);
          score += 10 * o.maxHp * level;
          if (o.bomb) queue.push(o);
        }
      }
    }
    updateHUD();
    shakeFrames = Math.min(20, 6 + hit.size * 2);
    shakeAmt = Math.min(10, 3 + hit.size);
    const ox = origin.x + origin.w / 2, oy = origin.y + origin.h / 2;
    particles.push({ kind: 'ring', x: ox, y: oy, r: 6, hue: 25, alpha: 1.2, rspd: 7 });
    particles.push({ kind: 'ring', x: ox, y: oy, r: 2, hue: 50, alpha: 1.0, rspd: 3.5 });
    bearReact('happy');
    playTone(110, 0.28, 'sawtooth', 0.07);
  }

  // ── Particles ─────────────────────────────────────────────────────
  function spawnBurst(x, y, hue, n) {
    particles.push({ kind: 'ring', x, y, r: 4, hue, alpha: 1, rspd: 3 });
    for (let i = 0; i < (n || 6); i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 3.5;
      particles.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue, alpha: 1, decay: 0.07 + Math.random() * 0.05 });
    }
  }

  function spawnBreak(brick) {
    const hue = HP_HUE[brick.maxHp] || 200;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1.5 + Math.random() * 3.5;
      particles.push({
        kind: 'shard',
        x: brick.x + brick.w / 2 + (Math.random() - 0.5) * brick.w * 0.6,
        y: brick.y + brick.h / 2 + (Math.random() - 0.5) * brick.h * 0.6,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        w: 3 + Math.random() * 4, h: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2, rotV: (Math.random() - 0.5) * 0.3,
        hue, alpha: 1, decay: 0.025 + Math.random() * 0.02, g: 0.16,
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.kind === 'ring') { p.r += p.rspd; p.alpha -= 0.06; }
      else if (p.kind === 'spark') { p.x += p.vx; p.y += p.vy; p.vx *= 0.85; p.vy *= 0.85; p.alpha -= p.decay; }
      else { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.rotV; p.alpha -= p.decay; }
      if (p.alpha <= 0) particles.splice(i, 1);
    }
  }

  // ── Collision ─────────────────────────────────────────────────────
  function circleRect(cx, cy, cr, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  function bounceRect(rx, ry, rw, rh, b) {
    const overL = (b.x + b.r) - rx;
    const overR = (rx + rw) - (b.x - b.r);
    const overT = (b.y + b.r) - ry;
    const overB = (ry + rh) - (b.y - b.r);
    if (Math.min(overL, overR) < Math.min(overT, overB)) {
      b.vx = -b.vx;
      b.x = overL < overR ? rx - b.r : rx + rw + b.r;
    } else {
      b.vy = -b.vy;
      b.y = overT < overB ? ry - b.r : ry + rh + b.r;
    }
  }

  // ── Update ────────────────────────────────────────────────────────
  function update() {
    if (state !== 'playing' && state !== 'ready') return;

    // Paddle movement — pointer/keys aim the stuck ball instead while aiming
    if (aim) {
      if (pointerX !== null) {
        const t = Math.max(0, Math.min(1, pointerX / W));        // 0..1 across canvas
        aim.angle = -Math.PI / 2 + (t - 0.5) * 1.9;
      }
      if (keys['ArrowLeft'])  aim.angle -= 0.045;
      if (keys['ArrowRight']) aim.angle += 0.045;
      aim.angle = Math.max(-Math.PI / 2 - 1.15, Math.min(-Math.PI / 2 + 1.15, aim.angle));
    } else {
      if (pointerX !== null) paddle.x = pointerX - paddle.w / 2;
      if (keys['ArrowLeft'])  paddle.x -= PADDLE_SPD;
      if (keys['ArrowRight']) paddle.x += PADDLE_SPD;
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    }

    // Balls
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];

      if (!b.launched) {
        b.x = paddle.x + paddle.w / 2;
        b.y = PADDLE_Y - b.r - 1;
        b.trail.length = 0;
        continue;
      }

      // Record position for the trail before moving
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > TRAIL_LEN) b.trail.shift();

      b.x += b.vx;
      b.y += b.vy;

      // Walls
      if (b.x - b.r < 0)  { b.x = b.r; b.vx = Math.abs(b.vx); spawnBurst(b.x, b.y, 285, 4); playTone(180, 0.03, 'sine', 0.03); }
      if (b.x + b.r > W)  { b.x = W - b.r; b.vx = -Math.abs(b.vx); spawnBurst(b.x, b.y, 285, 4); playTone(180, 0.03, 'sine', 0.03); }
      if (b.y - b.r < 0)  { b.y = b.r; b.vy = Math.abs(b.vy); spawnBurst(b.x, b.y, 285, 4); playTone(200, 0.03, 'sine', 0.03); }

      // Floor
      if (b.y - b.r > H) {
        if (fx.force && balls.length === 1) {
          b.y = H - b.r; b.vy = -Math.abs(b.vy); fx.force = false;
          spawnBurst(b.x, H - b.r, FORCE_MS_HUE, 18);
          shakeFrames = 8; shakeAmt = 5;
        } else {
          balls.splice(i, 1);
          continue;
        }
      }

      // Paddle
      if (b.vy > 0 && circleRect(b.x, b.y, b.r, paddle.x, PADDLE_Y, paddle.w, PADDLE_H)) {
        combo = 0;                                        // touching the paddle resets the chain
        const spd = Math.hypot(b.vx, b.vy) || curSpeed();
        if (fx.sticky && !aim) {
          // Catch the ball for an aimed shot (Aim power-up)
          b.launched = false; b.vx = 0; b.vy = 0;
          b.y = PADDLE_Y - b.r - 1;
          aim = { b, angle: -Math.PI / 2, spd };
          fx.sticky = false;
          spawnBurst(b.x, b.y, 50, 10);
          bearReact('happy');
          playTone(360, 0.1, 'triangle');
          showMsg('Aim with mouse / ◀ ▶, then LAUNCH');
        } else {
          const hit = (b.x - paddle.x) / paddle.w;        // 0..1
          const angle = -Math.PI / 2 + (hit - 0.5) * Math.PI * 0.7;
          b.vx = Math.cos(angle) * spd;
          b.vy = Math.sin(angle) * spd;
          b.y = PADDLE_Y - b.r;
          spawnBurst(b.x, b.y, 310, 4);
          playTone(300, 0.05, 'sine', 0.04);
        }
      }

      // Bricks
      for (const brick of bricks) {
        if (!brick.alive) continue;
        if (circleRect(b.x, b.y, b.r, brick.x, brick.y, brick.w, brick.h)) {
          bounceRect(brick.x, brick.y, brick.w, brick.h, b);
          nudge(b);
          spawnBurst(b.x, b.y, HP_HUE[brick.maxHp] || 200, 4);
          brick.hp--;
          playTone(300 + combo * 18, 0.04, 'square', 0.035);
          if (brick.hp <= 0) {
            brick.alive = false;
            combo++;
            const gained = 10 * brick.maxHp * level + (combo - 1) * 5;
            score += gained;
            spawnBreak(brick);
            maybeDropPowerup(brick);
            addFloater('+' + gained, brick.x + brick.w / 2, brick.y + brick.h / 2, HP_HUE[brick.maxHp] || 270);
            if (combo >= 3) addFloater('x' + combo, brick.x + brick.w / 2, brick.y - 6, 50);
            updateHUD();
            if (combo >= 4) bearReact('happy');
            if (brick.bomb) detonate(brick);
            else { shakeFrames = 4; shakeAmt = 2; }
          }
          break;
        }
      }
    }

    // All balls gone
    if (state === 'playing' && balls.length === 0) {
      loseLife();
      return;
    }

    // Level cleared
    if (state === 'playing' && bricks.every(b => !b.alive)) {
      level++;
      updateHUD();
      bearReact('happy');
      playTone(523, 0.12, 'triangle'); playTone(784, 0.18, 'triangle');
      resetForLevel();
      state = 'ready';
      showMsg('Level ' + level + ' — press LAUNCH');
      updateGoBtn();
    }

    // Falling power-ups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const pu = powerups[i];
      pu.y += PU_FALL;
      const caught = pu.y + PU_H >= PADDLE_Y &&
                     pu.x + PU_W >= paddle.x &&
                     pu.x <= paddle.x + paddle.w &&
                     pu.y <= PADDLE_Y + PADDLE_H;
      if (caught) { applyPowerup(pu.type); powerups.splice(i, 1); continue; }
      if (pu.y > H) powerups.splice(i, 1);
    }

    // Timers
    if (fx.wide > 0)   { fx.wide--;   if (fx.wide === 0)   setPaddleWidth(PADDLE_W); }
    if (fx.narrow > 0) { fx.narrow--; if (fx.narrow === 0) setPaddleWidth(PADDLE_W); }
    if (shakeFrames > 0) shakeFrames--;

    // Floating text + mascot mood decay
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= 0.6; f.life -= 0.02;
      if (f.life <= 0) floaters.splice(i, 1);
    }
    if (bear.life > 0) bear.life = Math.max(0, bear.life - 0.02);

    updateParticles();
  }

  // ── Neon bear mascot — reacts to combos, power-ups & misses ──────
  function drawBearBg() {
    const bx = W / 2, by = H * 0.48;
    const hr = 130; // head radius
    const mood = bear.life > 0 ? bear.type : 'idle';
    const t = bear.life;                              // reaction intensity 0..1
    const baseAlpha = 0.07 + t * 0.07;
    let stroke = '#ff80d4', glow = '#ff60cc';
    if (mood === 'happy') { stroke = '#ffd486'; glow = '#ffb84d'; }
    else if (mood === 'sad') { stroke = '#8ab6ff'; glow = '#5f8cff'; }

    ctx.save();
    ctx.globalAlpha = baseAlpha;
    ctx.strokeStyle = stroke;
    ctx.shadowColor = glow;
    ctx.shadowBlur = 18 + t * 24;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    // head
    ctx.beginPath(); ctx.arc(bx, by, hr, 0, Math.PI * 2); ctx.stroke();
    // ears (rounded bumps)
    for (const [ex, ey] of [[bx - 98, by - 108], [bx + 98, by - 108]]) {
      ctx.beginPath(); ctx.arc(ex, ey, 38, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = baseAlpha * 0.6;
      ctx.beginPath(); ctx.arc(ex, ey, 20, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = baseAlpha;
    }
    // eyes — expression by mood
    if (mood === 'happy') {
      for (const ex of [bx - 44, bx + 44]) {                       // ^ ^ happy arcs
        ctx.beginPath(); ctx.arc(ex, by - 18, 14, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      }
    } else if (mood === 'sad') {
      for (const [ex, dir] of [[bx - 44, 1], [bx + 44, -1]]) {      // sad downward brows
        ctx.beginPath();
        ctx.moveTo(ex - 11 * dir, by - 34);
        ctx.lineTo(ex + 11 * dir, by - 22);
        ctx.stroke();
      }
    } else {
      for (const ex of [bx - 44, bx + 44]) {
        ctx.beginPath(); ctx.arc(ex, by - 26, 13, 0, Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = baseAlpha + 0.05;
        ctx.fillStyle = stroke;
        ctx.beginPath(); ctx.arc(ex, by - 26, 5, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = baseAlpha;
      }
    }
    // snout
    ctx.beginPath(); ctx.ellipse(bx, by + 48, 44, 32, 0, 0, Math.PI * 2); ctx.stroke();
    // nose
    ctx.globalAlpha = baseAlpha + 0.04;
    ctx.fillStyle = stroke;
    ctx.beginPath(); ctx.arc(bx, by + 26, 9, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = baseAlpha;
    // mouth — frown when sad, smile otherwise
    ctx.beginPath();
    if (mood === 'sad') ctx.arc(bx, by + 78, 16, Math.PI * 1.15, Math.PI * 1.85);
    else                ctx.arc(bx, by + 50, 18, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    // reaction halo
    if (t > 0) {
      ctx.globalAlpha = t * 0.12;
      ctx.beginPath(); ctx.arc(bx, by, hr + 16 + t * 20, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Aim preview (ricochet trajectory for the Aim power-up) ───────
  function drawAim() {
    if (!aim) return;
    const b = aim.b;
    let x = b.x, y = b.y;
    let vx = Math.cos(aim.angle), vy = Math.sin(aim.angle);
    const step = 7;
    const dots = [];
    let bounces = 0;
    for (let i = 0; i < 240 && bounces < 4; i++) {
      x += vx * step; y += vy * step;
      if (x < b.r)       { x = b.r;     vx = Math.abs(vx);  bounces++; }
      else if (x > W - b.r) { x = W - b.r; vx = -Math.abs(vx); bounces++; }
      if (y < b.r)       { y = b.r;     vy = Math.abs(vy);  bounces++; }
      let hitBrick = false;
      for (const br of bricks) {
        if (br.alive && x > br.x && x < br.x + br.w && y > br.y && y < br.y + br.h) { hitBrick = true; break; }
      }
      if (hitBrick) { dots.push({ x, y, hit: true }); break; }
      if (y > PADDLE_Y) break;
      if (i % 2 === 0) dots.push({ x, y, hit: false });
    }
    ctx.save();
    for (const d of dots) {
      ctx.globalAlpha = d.hit ? 0.95 : 0.5;
      ctx.fillStyle = d.hit ? '#ffe7a8' : '#ffd486';
      ctx.shadowColor = '#ffb84d';
      ctx.shadowBlur = d.hit ? 12 : 6;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.hit ? 4.5 : 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ── Draw ──────────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Bear watermark is drawn outside the shake transform so it stays still
    drawBearBg();

    ctx.save();
    if (shakeFrames > 0) {
      ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);
    }

    // Bricks — pastel neon with glow
    for (const b of bricks) {
      if (!b.alive) continue;
      const ratio = b.hp / b.maxHp;
      const alpha = 0.55 + 0.45 * ratio;
      const hue = b.bomb ? 18 : (HP_HUE[b.maxHp] || 270);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.shadowColor = b.bomb ? 'rgba(255,120,60,0.9)' : `hsla(${hue}, 100%, 75%, 0.7)`;
      ctx.shadowBlur = b.bomb ? 10 : 8;
      ctx.fillStyle = `hsl(${hue}, 75%, ${b.bomb ? 52 : 72}%)`;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      // shine
      ctx.globalAlpha = alpha * 0.4;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(b.x + 3, b.y + 3, b.w - 6, 3);
      // bomb marker
      if (b.bomb) {
        ctx.globalAlpha = alpha;
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        ctx.fillStyle = '#fff4c0';
        ctx.beginPath();
        for (let s = 0; s < 16; s++) {
          const a = (s / 16) * Math.PI * 2;
          const sr = s % 2 === 0 ? 6 : 3;
          const px = cx + Math.cos(a) * sr, py = cy + Math.sin(a) * sr;
          s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // Particles
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      if (p.kind === 'ring') {
        ctx.strokeStyle = `hsl(${p.hue}, 85%, 80%)`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      } else if (p.kind === 'spark') {
        ctx.strokeStyle = `hsl(${p.hue}, 100%, 82%)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); ctx.stroke();
      } else {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = `hsl(${p.hue}, 80%, 78%)`;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }

    // Power-ups
    for (const pu of powerups) {
      const def = PU[pu.type];
      ctx.save();
      ctx.shadowColor = `hsl(${def.hue}, 100%, 75%)`;
      ctx.shadowBlur = 10;
      ctx.fillStyle = `hsl(${def.hue}, 70%, 58%)`;
      ctx.strokeStyle = `hsl(${def.hue}, 100%, 88%)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(pu.x, pu.y, PU_W, PU_H, 5);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Courier New';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.label, pu.x + PU_W / 2, pu.y + PU_H / 2 + 1);
      ctx.restore();
    }

    // Force-field line
    if (fx.force) {
      const fy = H - 7;
      const g = ctx.createLinearGradient(0, fy, W, fy);
      g.addColorStop(0, 'transparent');
      g.addColorStop(0.5, `hsl(${FORCE_MS_HUE}, 90%, 80%)`);
      g.addColorStop(1, 'transparent');
      ctx.save();
      ctx.shadowColor = `hsl(${FORCE_MS_HUE}, 100%, 70%)`;
      ctx.shadowBlur = 16;
      ctx.strokeStyle = g; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
      ctx.restore();
    }

    // Paddle — pastel neon with glow
    const pg = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    ctx.save();
    if (fx.wide > 0) {
      pg.addColorStop(0, '#80ffbe'); pg.addColorStop(1, '#30d880');
      ctx.strokeStyle = '#b0ffe0';
      ctx.shadowColor = 'rgba(80, 255, 160, 0.8)';
    } else if (fx.narrow > 0) {
      pg.addColorStop(0, '#ff8aaa'); pg.addColorStop(1, '#e03060');
      ctx.strokeStyle = '#ffbbcc';
      ctx.shadowColor = 'rgba(255, 100, 140, 0.8)';
    } else {
      pg.addColorStop(0, '#e090ff'); pg.addColorStop(1, '#a030d0');
      ctx.strokeStyle = '#f0b8ff';
      ctx.shadowColor = 'rgba(200, 100, 255, 0.8)';
    }
    ctx.shadowBlur = 16;
    ctx.fillStyle = pg; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // Balls — pastel white/pink with trail and glow
    for (const b of balls) {
      const n = b.trail.length;
      for (let t = 0; t < n; t++) {
        const f = (t + 1) / n;
        ctx.save();
        ctx.globalAlpha = f * 0.18;
        ctx.fillStyle = '#ffb0e8';
        ctx.beginPath();
        ctx.arc(b.trail[t].x, b.trail[t].y, b.r * (0.35 + 0.5 * f), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.save();
      ctx.shadowColor = 'rgba(255, 160, 240, 0.85)';
      ctx.shadowBlur = 16;
      const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, '#f0a8ff');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Aim trajectory preview
    drawAim();

    // Floating score / combo text
    for (const f of floaters) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.3));
      ctx.fillStyle = `hsl(${f.hue}, 100%, 80%)`;
      ctx.shadowColor = `hsl(${f.hue}, 100%, 70%)`;
      ctx.shadowBlur = 8;
      ctx.font = 'bold 14px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    // Combo meter
    if (combo >= 2 && state === 'playing') {
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = '#ffe7a8';
      ctx.shadowColor = '#ffb84d'; ctx.shadowBlur = 10;
      ctx.font = 'bold 17px Courier New';
      ctx.textAlign = 'right';
      ctx.fillText('COMBO x' + combo, W - 10, 26);
      ctx.restore();
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ── HUD / messages ────────────────────────────────────────────────
  function updateHUD() {
    document.getElementById('scoreEl').textContent = score;
    document.getElementById('levelEl').textContent = level;
    document.getElementById('livesEl').textContent = Math.max(0, lives);
  }
  function showMsg(m) { document.getElementById('message').textContent = m; }
  function clearMsg() { document.getElementById('message').textContent = ''; }
  function updateGoBtn() {
    const btn = document.getElementById('btnGo');
    if (state === 'dead') btn.textContent = 'RESTART';
    else if (state === 'playing') btn.textContent = '·····';
    else btn.textContent = 'LAUNCH';
  }

  // ── Input ─────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); launch(); }
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  function canvasX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  }

  canvas.addEventListener('pointerdown', e => { e.preventDefault(); pointerX = canvasX(e); launch(); });
  canvas.addEventListener('pointermove', e => { e.preventDefault(); pointerX = canvasX(e); });
  canvas.addEventListener('pointerleave', () => { pointerX = null; });

  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const btnGo = document.getElementById('btnGo');

  function hold(key, down) { keys[key] = down; }
  btnLeft.addEventListener('pointerdown',  e => { e.preventDefault(); hold('ArrowLeft', true); });
  btnLeft.addEventListener('pointerup',    e => { e.preventDefault(); hold('ArrowLeft', false); });
  btnLeft.addEventListener('pointerleave', () => hold('ArrowLeft', false));
  btnRight.addEventListener('pointerdown',  e => { e.preventDefault(); hold('ArrowRight', true); });
  btnRight.addEventListener('pointerup',    e => { e.preventDefault(); hold('ArrowRight', false); });
  btnRight.addEventListener('pointerleave', () => hold('ArrowRight', false));
  btnGo.addEventListener('pointerdown', e => { e.preventDefault(); launch(); });

  // Sound toggle
  const btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', () => {
    soundOn = !soundOn;
    btnSound.innerHTML = soundOn ? '&#9834; ON' : '&#9834; OFF';
    btnSound.classList.toggle('off', !soundOn);
    if (soundOn) playTone(660, 0.08, 'triangle');
  });

  // Resume audio on first gesture (browser autoplay policy)
  function resumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.addEventListener('pointerdown', resumeAudio);
  document.addEventListener('keydown', resumeAudio);

  // ── Boot ──────────────────────────────────────────────────────────
  startGame();
  state = 'idle';
  showMsg('Press SPACE or tap LAUNCH to start');
  loop();
  </script>
</body>
</html>
