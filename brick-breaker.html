<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Brick Breaker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(circle at 50% 20%, #1a0d2e 0%, #0d0818 60%, #080510 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #f0e6ff;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      font-size: clamp(1.1rem, 5vw, 2.1rem);
      letter-spacing: 6px;
      margin-bottom: 10px;
      color: #ffb3e6;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(255, 130, 210, 0.8), 0 0 40px rgba(255, 100, 200, 0.3);
      animation: titleGlow 3.2s ease-in-out infinite;
    }
    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 16px rgba(255, 130, 210, 0.8), 0 0 40px rgba(255, 100, 200, 0.3); }
      50%      { text-shadow: 0 0 26px rgba(255, 160, 235, 1), 0 0 64px rgba(255, 120, 220, 0.55); }
    }

    #hud {
      display: flex;
      align-items: center;
      gap: clamp(8px, 3vw, 18px);
      margin-bottom: 10px;
      font-size: clamp(0.7rem, 2.6vw, 1rem);
      letter-spacing: 2px;
    }

    #hud > div {
      background: rgba(40, 20, 64, 0.45);
      border: 1px solid rgba(150, 90, 200, 0.32);
      border-radius: 10px;
      padding: 5px 13px;
    }

    #hud span { color: #c084e8; }
    #hud b    { color: #ffe6f9; }

    #btnSound {
      background: #1a0d2e;
      color: #b8ffea;
      border: 1px solid #4a7a6a;
      border-radius: 8px;
      font-family: inherit;
      font-size: clamp(0.6rem, 2vw, 0.78rem);
      letter-spacing: 1px;
      padding: 3px 10px;
      cursor: pointer;
    }
    #btnSound.off { color: #7a5a8a; border-color: #3a2a4a; }

    canvas {
      display: block;
      background: #080510;
      border: 2px solid #9b30c8;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(200, 100, 255, 0.4), 0 0 90px rgba(255, 100, 200, 0.18),
                  inset 0 0 40px rgba(120, 40, 160, 0.15);
      width: min(480px, 96vw);
      height: auto;
      touch-action: none;
    }

    #message {
      margin-top: 12px;
      font-size: clamp(0.75rem, 2.6vw, 1.05rem);
      letter-spacing: 2px;
      min-height: 1.4em;
      color: #b8ffea;
      text-shadow: 0 0 10px rgba(100, 255, 210, 0.6);
      text-align: center;
      padding: 0 10px;
    }

    #hint {
      margin-top: 6px;
      font-size: clamp(0.55rem, 1.9vw, 0.72rem);
      color: #7a5a8a;
      letter-spacing: 1px;
      text-align: center;
    }

    #pad {
      display: flex;
      gap: 22px;
      margin-top: 16px;
    }

    #pad button {
      background: #1a0d2e;
      color: #e0b0ff;
      border: 2px solid #7a30b0;
      border-radius: 12px;
      font-size: 1.5rem;
      padding: 14px 30px;
      cursor: pointer;
      touch-action: none;
      transition: background 0.1s, transform 0.05s;
    }
    #pad button:hover { border-color: #b060e0; box-shadow: 0 0 14px rgba(160, 80, 220, 0.5); }
    #pad button:active { background: #3a1060; transform: translateY(1px); }

    #btnGo {
      background: #8b1a6e;
      color: #ffe6f9;
      border-color: #ff80d0;
      font-size: 0.95rem;
      letter-spacing: 2px;
      min-width: 100px;
      text-shadow: 0 0 8px rgba(255, 150, 220, 0.8);
    }
    #btnGo:active { background: #c0307a; }
  </style>
</head>
<body>
  <h1>Brick&nbsp;Breaker</h1>

  <div id="hud">
    <div><span>SCORE </span><b id="scoreEl">0</b></div>
    <div><span>LEVEL </span><b id="levelEl">1</b></div>
    <div><span>LIVES </span><b id="livesEl">3</b></div>
    <button id="btnSound" aria-label="Toggle sound">&#9834; ON</button>
  </div>

  <canvas id="game" width="480" height="640"></canvas>

  <div id="message">Press SPACE or tap LAUNCH to start</div>
  <div id="hint">Move: mouse / arrows / ◀ ▶ &nbsp;|&nbsp; Launch: SPACE / tap</div>

  <div id="pad">
    <button id="btnLeft">&#9664;</button>
    <button id="btnGo">LAUNCH</button>
    <button id="btnRight">&#9654;</button>
  </div>

  <script>
  "use strict";

  // ── Canvas ────────────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ── Tunables ──────────────────────────────────────────────────────
  const PADDLE_W = 86, PADDLE_H = 14, PADDLE_Y = H - 44, PADDLE_SPD = 7;
  const PADDLE_FOLLOW = 18;   // max px/frame the paddle glides toward a far touch (no teleport)
  const BALL_R = 7;
  const BASE_SPD = 5.2, SPD_MAX = 11, SPD_GAIN = 1.015;
  const TRAIL_LEN = 7;   // how many past positions the ball trail remembers

  const COLS = 9, ROWS = 6;
  const BRICK_PAD = 6, BRICK_TOP = 64;
  const BRICK_W = (W - BRICK_PAD * (COLS + 1)) / COLS;
  const BRICK_H = 22;

  // Brick colours indexed by hp (1..4) — pastel neon palette
  const HP_HUE = [0, 168, 270, 18, 318]; // index 1..4: mint, lavender, peach, hot-pink

  // ── Power-ups ─────────────────────────────────────────────────────
  const PU = {
    multi:  { label: 'M', hue: 280, good: true  },
    wide:   { label: 'W', hue: 155, good: true  },
    slow:   { label: 'S', hue: 195, good: true  },
    life:   { label: '+', hue: 330, good: true  },
    force:  { label: 'F', hue: 240, good: true  },
    aim:    { label: 'A', hue: 50,  good: true  },
    shield: { label: 'D', hue: 285, good: true  },  // Defense barrier
    phase:  { label: 'P', hue: 168, good: true  },  // Phase through bricks
    tiny:   { label: 'T', hue: 25,  good: true  },  // Tiny, fast ball
    narrow: { label: 'N', hue: 18,  good: false },
    fast:   { label: 'X', hue: 45,  good: false },
  };
  const PU_KEYS = Object.keys(PU);
  const PU_WEIGHTS = { multi: 4, wide: 4, slow: 3, life: 1, force: 2, aim: 3, shield: 3, phase: 2, tiny: 2, narrow: 3, fast: 3 };
  const PU_W = 20, PU_H = 20, PU_FALL = 2.0, PU_DROP_CHANCE = 0.26;
  const WIDE_FRAMES = 600, NARROW_FRAMES = 480, PHASE_FRAMES = 480, TINY_FRAMES = 540;
  const TINY_R = 4, TINY_BOOST = 1.4;
  const FORCE_MS_HUE = 270;

  // Honour the OS "reduce motion" setting (less shake & fewer particles)
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ── State ─────────────────────────────────────────────────────────
  let state = 'idle';            // idle | ready | playing | dead | win
  let score = 0, lives = 3, level = 1;
  let paddle = { x: W / 2 - PADDLE_W / 2, w: PADDLE_W };
  let balls = [];
  let bricks = [];
  let powerups = [];
  let particles = [];
  let keys = {};
  let pointerX = null;
  let pointerKind = 'mouse';     // 'mouse' | 'touch' | 'pen'
  let dragging = false;          // true while a finger directly carries the paddle
  let grabOffset = 0;            // finger-to-paddle.x offset held during a direct drag
  let fx = { wide: 0, narrow: 0, force: false, sticky: false, shield: false, phase: 0, tiny: 0 };
  let shakeFrames = 0, shakeAmt = 0;
  let paddleHit = 0;             // squash/flash intensity on ball impact (decays)
  let combo = 0;                 // bricks cleared since last paddle touch
  let floaters = [];             // floating "+score" / "xCombo" text
  let bear = { type: 'idle', life: 0 };   // reactive mascot mood
  let aim = null;                // { b, angle } while a ball is stuck for aiming

  // ── Sound (Web Audio synthesis) ───────────────────────────────────
  let soundOn = true;
  let audioCtx = null;
  function playTone(freq, dur, type = 'sine', vol = 0.05) {
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) { soundOn = false; }
  }

  function bearReact(type) { bear = { type, life: 1 }; }

  function addFloater(text, x, y, hue) {
    floaters.push({ text, x, y, hue, life: 1 });
  }

  // ── Factory helpers ───────────────────────────────────────────────
  function newBall(x, y, vx, vy, launched) {
    return { x, y, vx, vy, r: fx.tiny > 0 ? TINY_R : BALL_R, launched: !!launched, trail: [] };
  }

  function restingBall() {
    return newBall(paddle.x + paddle.w / 2, PADDLE_Y - BALL_R - 1, 0, 0, false);
  }

  function buildBricks(lvl) {
    const list = [];
    const maxHp = Math.min(1 + Math.floor((lvl - 1) / 1), 4);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        // leave occasional gaps on higher levels for variety
        if (lvl > 2 && Math.random() < 0.08) continue;
        const hp = Math.max(1, Math.min(maxHp, ROWS - r >= ROWS - 1 ? 1 : Math.ceil((ROWS - r) / 2)));
        list.push({
          x: BRICK_PAD + c * (BRICK_W + BRICK_PAD),
          y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
          w: BRICK_W, h: BRICK_H,
          col: c, row: r,
          hp, maxHp: hp,
          alive: true,
          bomb: Math.random() < 0.11,
        });
      }
    }
    return list;
  }

  function curSpeed() { return BASE_SPD + (level - 1) * 0.4; }

  // ── Game lifecycle ────────────────────────────────────────────────
  function startGame() {
    score = 0; lives = 3; level = 1;
    resetForLevel();
    state = 'ready';
    showMsg('Press SPACE or tap LAUNCH');
    updateHUD();
    updateGoBtn();
  }

  function resetForLevel() {
    paddle.w = PADDLE_W;
    paddle.x = W / 2 - paddle.w / 2;
    bricks = buildBricks(level);
    powerups = [];
    particles = [];
    floaters = [];
    fx = { wide: 0, narrow: 0, force: false, sticky: false, shield: false, phase: 0, tiny: 0 };
    aim = null;
    combo = 0;
    balls = [restingBall()];
    shakeFrames = 0;
  }

  function loseLife() {
    lives--;
    updateHUD();
    powerups = [];
    fx = { wide: 0, narrow: 0, force: false, sticky: false, shield: false, phase: 0, tiny: 0 };
    aim = null;
    combo = 0;
    paddle.w = PADDLE_W;
    bearReact('sad');
    playTone(140, 0.35, 'sawtooth', 0.06);
    buzz(50);
    if (lives <= 0) {
      state = 'dead';
      showMsg('GAME OVER — press LAUNCH to restart');
      playTone(90, 0.5, 'sawtooth', 0.06);
    } else {
      state = 'ready';
      balls = [restingBall()];
      showMsg('Ball lost — press LAUNCH');
    }
    updateGoBtn();
  }

  function launch() {
    if (state === 'idle' || state === 'dead' || state === 'win') {
      startGame();
      return;
    }
    // Fire an aimed shot from a ball stuck on the paddle (Aim power-up)
    if (aim) {
      const b = aim.b;
      b.vx = Math.cos(aim.angle) * aim.spd;
      b.vy = Math.sin(aim.angle) * aim.spd;
      b.launched = true;
      aim = null;
      bearReact('happy');
      playTone(520, 0.12, 'triangle');
      return;
    }
    if (state === 'ready') {
      const b = balls[0];
      const spd = curSpeed();
      const hit = (b.x - paddle.x) / paddle.w;          // 0..1
      const angle = -Math.PI / 2 + (hit - 0.5) * Math.PI * 0.6;
      b.vx = Math.cos(angle) * spd;
      b.vy = Math.sin(angle) * spd;
      b.launched = true;
      state = 'playing';
      clearMsg();
      playTone(420, 0.1, 'triangle');
      updateGoBtn();
    }
  }

  // ── Power-up logic ────────────────────────────────────────────────
  function pickPowerup() {
    const total = PU_KEYS.reduce((s, k) => s + PU_WEIGHTS[k], 0);
    let r = Math.random() * total;
    for (const k of PU_KEYS) { r -= PU_WEIGHTS[k]; if (r <= 0) return k; }
    return PU_KEYS[0];
  }

  function maybeDropPowerup(brick) {
    if (Math.random() > PU_DROP_CHANCE) return;
    const type = pickPowerup();
    powerups.push({
      type,
      x: brick.x + brick.w / 2 - PU_W / 2,
      y: brick.y + brick.h / 2,
    });
  }

  function applyPowerup(type) {
    spawnBurst(paddle.x + paddle.w / 2, PADDLE_Y, PU[type].hue, 14);
    bearReact(PU[type].good ? 'happy' : 'sad');
    playTone(PU[type].good ? 600 : 240, 0.16, 'triangle', 0.05);
    buzz(20);
    switch (type) {
      case 'multi': {
        const extra = [];
        for (const b of balls) {
          if (!b.launched) continue;
          const spd = Math.hypot(b.vx, b.vy) || curSpeed();
          const base = Math.atan2(b.vy, b.vx);
          for (const da of [-0.4, 0.4]) {
            extra.push(newBall(b.x, b.y, Math.cos(base + da) * spd, Math.sin(base + da) * spd, true));
          }
        }
        balls = balls.concat(extra).slice(0, 9);
        break;
      }
      case 'wide':
        fx.wide = WIDE_FRAMES; fx.narrow = 0;
        setPaddleWidth(Math.round(PADDLE_W * 1.6));
        break;
      case 'narrow':
        fx.narrow = NARROW_FRAMES; fx.wide = 0;
        setPaddleWidth(Math.round(PADDLE_W * 0.6));
        break;
      case 'slow':
        for (const b of balls) scaleBall(b, 0.75);
        break;
      case 'fast':
        for (const b of balls) scaleBall(b, 1.3);
        break;
      case 'life':
        lives++; updateHUD();
        break;
      case 'force':
        fx.force = true;
        break;
      case 'aim':
        fx.sticky = true;
        break;
      case 'shield':
        fx.shield = true;
        break;
      case 'phase':
        fx.phase = PHASE_FRAMES;
        break;
      case 'tiny':
        if (fx.tiny <= 0) for (const b of balls) scaleBall(b, TINY_BOOST);
        fx.tiny = TINY_FRAMES;
        break;
    }
  }

  function setPaddleWidth(w) {
    const cx = paddle.x + paddle.w / 2;
    paddle.w = w;
    paddle.x = Math.max(0, Math.min(W - w, cx - w / 2));
  }

  function scaleBall(b, factor) {
    if (!b.launched) return;
    const cur = Math.hypot(b.vx, b.vy);
    if (cur === 0) return;
    const nxt = Math.max(2.5, Math.min(SPD_MAX, cur * factor));
    b.vx = (b.vx / cur) * nxt;
    b.vy = (b.vy / cur) * nxt;
  }

  function nudge(b) {
    const cur = Math.hypot(b.vx, b.vy);
    if (cur === 0 || cur >= SPD_MAX) return;
    const nxt = Math.min(cur * SPD_GAIN, SPD_MAX);
    b.vx = (b.vx / cur) * nxt;
    b.vy = (b.vy / cur) * nxt;
  }

  // ── Bomb chain reaction ───────────────────────────────────────────
  function detonate(origin) {
    const queue = [origin];
    const hit = new Set([origin]);
    while (queue.length) {
      const cur = queue.shift();
      for (const o of bricks) {
        if (!o.alive || hit.has(o)) continue;
        if (Math.abs(o.col - cur.col) <= 1 && Math.abs(o.row - cur.row) <= 1) {
          o.alive = false;
          hit.add(o);
          spawnBreak(o);
          score += 10 * o.maxHp * level;
          if (o.bomb) queue.push(o);
        }
      }
    }
    updateHUD();
    shakeFrames = Math.min(20, 6 + hit.size * 2);
    shakeAmt = Math.min(10, 3 + hit.size);
    const ox = origin.x + origin.w / 2, oy = origin.y + origin.h / 2;
    particles.push({ kind: 'ring', x: ox, y: oy, r: 6, hue: 25, alpha: 1.2, rspd: 7 });
    particles.push({ kind: 'ring', x: ox, y: oy, r: 2, hue: 50, alpha: 1.0, rspd: 3.5 });
    bearReact('happy');
    playTone(110, 0.28, 'sawtooth', 0.07);
    buzz(40);
  }

  // ── Particles ─────────────────────────────────────────────────────
  function spawnBurst(x, y, hue, n) {
    particles.push({ kind: 'ring', x, y, r: 4, hue, alpha: 1, rspd: 3 });
    for (let i = 0; i < (n || 6); i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 2 + Math.random() * 3.5;
      particles.push({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, hue, alpha: 1, decay: 0.07 + Math.random() * 0.05 });
    }
  }

  function spawnBreak(brick) {
    const hue = HP_HUE[brick.maxHp] || 200;
    for (let i = 0, n = reduceMotion ? 5 : 14; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1.5 + Math.random() * 3.5;
      particles.push({
        kind: 'shard',
        x: brick.x + brick.w / 2 + (Math.random() - 0.5) * brick.w * 0.6,
        y: brick.y + brick.h / 2 + (Math.random() - 0.5) * brick.h * 0.6,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
        w: 3 + Math.random() * 4, h: 2 + Math.random() * 4,
        rot: Math.random() * Math.PI * 2, rotV: (Math.random() - 0.5) * 0.3,
        hue, alpha: 1, decay: 0.025 + Math.random() * 0.02, g: 0.16,
      });
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (p.kind === 'ring') { p.r += p.rspd; p.alpha -= 0.06; }
      else if (p.kind === 'spark') { p.x += p.vx; p.y += p.vy; p.vx *= 0.85; p.vy *= 0.85; p.alpha -= p.decay; }
      else { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.rotV; p.alpha -= p.decay; }
      if (p.alpha <= 0) particles.splice(i, 1);
    }
  }

  // ── Collision ─────────────────────────────────────────────────────
  function circleRect(cx, cy, cr, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  function bounceRect(rx, ry, rw, rh, b) {
    const overL = (b.x + b.r) - rx;
    const overR = (rx + rw) - (b.x - b.r);
    const overT = (b.y + b.r) - ry;
    const overB = (ry + rh) - (b.y - b.r);
    if (Math.min(overL, overR) < Math.min(overT, overB)) {
      b.vx = -b.vx;
      b.x = overL < overR ? rx - b.r : rx + rw + b.r;
    } else {
      b.vy = -b.vy;
      b.y = overT < overB ? ry - b.r : ry + rh + b.r;
    }
  }

  // ── Update ────────────────────────────────────────────────────────
  function update() {
    if (state !== 'playing' && state !== 'ready') return;

    // Paddle movement — pointer/keys aim the stuck ball instead while aiming
    if (aim) {
      if (pointerX !== null) {
        const t = Math.max(0, Math.min(1, pointerX / W));        // 0..1 across canvas
        aim.angle = -Math.PI / 2 + (t - 0.5) * 1.9;
      }
      if (keys['ArrowLeft'])  aim.angle -= 0.045;
      if (keys['ArrowRight']) aim.angle += 0.045;
      aim.angle = Math.max(-Math.PI / 2 - 1.15, Math.min(-Math.PI / 2 + 1.15, aim.angle));
    } else {
      if (pointerX !== null) {
        if (pointerKind === 'touch') {
          if (dragging) {
            // Finger is directly carrying the paddle: 1:1, finger speed, no teleport
            paddle.x = pointerX - grabOffset;
          } else {
            // Finger is elsewhere: glide toward it, capped so it never teleports
            const dx = (pointerX - paddle.w / 2) - paddle.x;
            paddle.x += Math.max(-PADDLE_FOLLOW, Math.min(PADDLE_FOLLOW, dx));
            // Once the paddle reaches the finger, grab it and track 1:1 from here
            if (pointerX >= paddle.x && pointerX <= paddle.x + paddle.w) {
              dragging = true;
              grabOffset = pointerX - paddle.x;
            }
          }
        } else {
          // Mouse / pen: follow the cursor directly
          paddle.x = pointerX - paddle.w / 2;
        }
      }
      if (keys['ArrowLeft'])  { paddle.x -= PADDLE_SPD; dragging = false; }
      if (keys['ArrowRight']) { paddle.x += PADDLE_SPD; dragging = false; }
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    }

    // Balls
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      b.r = fx.tiny > 0 ? TINY_R : BALL_R;

      if (!b.launched) {
        b.x = paddle.x + paddle.w / 2;
        b.y = PADDLE_Y - b.r - 1;
        b.trail.length = 0;
        continue;
      }

      // Record position for the trail before moving
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > TRAIL_LEN) b.trail.shift();

      b.x += b.vx;
      b.y += b.vy;

      // Walls
      if (b.x - b.r < 0)  { b.x = b.r; b.vx = Math.abs(b.vx); spawnBurst(b.x, b.y, 285, 4); playTone(180, 0.03, 'sine', 0.03); }
      if (b.x + b.r > W)  { b.x = W - b.r; b.vx = -Math.abs(b.vx); spawnBurst(b.x, b.y, 285, 4); playTone(180, 0.03, 'sine', 0.03); }
      if (b.y - b.r < 0)  { b.y = b.r; b.vy = Math.abs(b.vy); spawnBurst(b.x, b.y, 285, 4); playTone(200, 0.03, 'sine', 0.03); }

      // Floor — shield (any ball) or force (last ball) bounces it back once
      if (b.y - b.r > H) {
        if (fx.shield) {
          b.y = H - b.r; b.vy = -Math.abs(b.vy); fx.shield = false;
          spawnBurst(b.x, H - b.r, 285, 20);
          shakeFrames = 8; shakeAmt = 5;
          bearReact('happy'); playTone(520, 0.16, 'sawtooth', 0.05); buzz(30);
          addFloater('SAVED', b.x, H - 24, 285);
        } else if (fx.force && balls.length === 1) {
          b.y = H - b.r; b.vy = -Math.abs(b.vy); fx.force = false;
          spawnBurst(b.x, H - b.r, FORCE_MS_HUE, 18);
          shakeFrames = 8; shakeAmt = 5;
        } else {
          balls.splice(i, 1);
          continue;
        }
      }

      // Paddle
      if (b.vy > 0 && circleRect(b.x, b.y, b.r, paddle.x, PADDLE_Y, paddle.w, PADDLE_H)) {
        combo = 0;                                        // touching the paddle resets the chain
        const spd = Math.hypot(b.vx, b.vy) || curSpeed();
        if (fx.sticky && !aim) {
          // Catch the ball for an aimed shot (Aim power-up)
          b.launched = false; b.vx = 0; b.vy = 0;
          b.y = PADDLE_Y - b.r - 1;
          aim = { b, angle: -Math.PI / 2, spd };
          fx.sticky = false;
          spawnBurst(b.x, b.y, 50, 10);
          bearReact('happy');
          playTone(360, 0.1, 'triangle');
          showMsg('Aim with mouse / ◀ ▶, then LAUNCH');
        } else {
          const hit = (b.x - paddle.x) / paddle.w;        // 0..1
          const angle = -Math.PI / 2 + (hit - 0.5) * Math.PI * 0.7;
          b.vx = Math.cos(angle) * spd;
          b.vy = Math.sin(angle) * spd;
          b.y = PADDLE_Y - b.r;
          spawnBurst(b.x, b.y, 310, 4);
          playTone(300, 0.05, 'sine', 0.04);
          paddleHit = 1;                                  // trigger squash/flash
          buzz(6);
        }
      }

      // Bricks
      for (const brick of bricks) {
        if (!brick.alive) continue;
        if (circleRect(b.x, b.y, b.r, brick.x, brick.y, brick.w, brick.h)) {
          const phasing = fx.phase > 0;
          if (!phasing) { bounceRect(brick.x, brick.y, brick.w, brick.h, b); nudge(b); }
          spawnBurst(b.x, b.y, HP_HUE[brick.maxHp] || 200, 4);
          brick.hp -= phasing ? brick.hp : 1;          // phase obliterates in one pass
          playTone(300 + combo * 18, 0.04, 'square', 0.035);
          if (brick.hp <= 0) {
            brick.alive = false;
            combo++;
            const gained = 10 * brick.maxHp * level + (combo - 1) * 5;
            score += gained;
            spawnBreak(brick);
            maybeDropPowerup(brick);
            addFloater('+' + gained, brick.x + brick.w / 2, brick.y + brick.h / 2, HP_HUE[brick.maxHp] || 270);
            if (combo >= 3) addFloater('x' + combo, brick.x + brick.w / 2, brick.y - 6, 50);
            updateHUD();
            buzz(8);
            if (combo >= 4) bearReact('happy');
            if (brick.bomb) detonate(brick);
            else { shakeFrames = 4; shakeAmt = 2; }
          }
          if (!phasing) break;                          // phase keeps plowing through
        }
      }
    }

    // All balls gone
    if (state === 'playing' && balls.length === 0) {
      loseLife();
      return;
    }

    // Level cleared
    if (state === 'playing' && bricks.every(b => !b.alive)) {
      level++;
      updateHUD();
      bearReact('happy');
      playTone(523, 0.12, 'triangle'); playTone(784, 0.18, 'triangle');
      resetForLevel();
      state = 'ready';
      showMsg('Level ' + level + ' — press LAUNCH');
      updateGoBtn();
    }

    // Falling power-ups
    for (let i = powerups.length - 1; i >= 0; i--) {
      const pu = powerups[i];
      pu.y += PU_FALL;
      const caught = pu.y + PU_H >= PADDLE_Y &&
                     pu.x + PU_W >= paddle.x &&
                     pu.x <= paddle.x + paddle.w &&
                     pu.y <= PADDLE_Y + PADDLE_H;
      if (caught) { applyPowerup(pu.type); powerups.splice(i, 1); continue; }
      if (pu.y > H) powerups.splice(i, 1);
    }

    // Timers
    if (fx.wide > 0)   { fx.wide--;   if (fx.wide === 0)   setPaddleWidth(PADDLE_W); }
    if (fx.narrow > 0) { fx.narrow--; if (fx.narrow === 0) setPaddleWidth(PADDLE_W); }
    if (fx.phase > 0)  fx.phase--;
    if (fx.tiny > 0)   { fx.tiny--; if (fx.tiny === 0) for (const b of balls) scaleBall(b, 1 / TINY_BOOST); }
    if (paddleHit > 0) paddleHit = Math.max(0, paddleHit - 0.09);
    if (shakeFrames > 0) shakeFrames--;

    // Floating text + mascot mood decay
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y -= 0.6; f.life -= 0.02;
      if (f.life <= 0) floaters.splice(i, 1);
    }
    if (bear.life > 0) bear.life = Math.max(0, bear.life - 0.02);

    updateParticles();
  }

  // ── Neon bear mascot — each mood painted once, then blitted faintly
  const bearSprites = new Map();
  function getBearSprite(mood) {
    let spr = bearSprites.get(mood);
    if (spr) return spr;
    spr = document.createElement('canvas');
    spr.width = W; spr.height = H;
    const g = spr.getContext('2d');
    const bx = W / 2, by = H * 0.48, hr = 130;
    let stroke = '#ff80d4', glow = '#ff60cc';
    if (mood === 'happy') { stroke = '#ffd486'; glow = '#ffb84d'; }
    else if (mood === 'sad') { stroke = '#8ab6ff'; glow = '#5f8cff'; }
    g.strokeStyle = stroke; g.shadowColor = glow; g.shadowBlur = 22;
    g.lineWidth = 3; g.lineCap = 'round';

    g.beginPath(); g.arc(bx, by, hr, 0, Math.PI * 2); g.stroke();
    for (const [ex, ey] of [[bx - 98, by - 108], [bx + 98, by - 108]]) {
      g.beginPath(); g.arc(ex, ey, 38, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 0.6; g.beginPath(); g.arc(ex, ey, 20, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
    }
    if (mood === 'happy') {
      for (const ex of [bx - 44, bx + 44]) { g.beginPath(); g.arc(ex, by - 18, 14, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); }
    } else if (mood === 'sad') {
      for (const [ex, dir] of [[bx - 44, 1], [bx + 44, -1]]) {
        g.beginPath(); g.moveTo(ex - 11 * dir, by - 34); g.lineTo(ex + 11 * dir, by - 22); g.stroke();
      }
    } else {
      for (const ex of [bx - 44, bx + 44]) {
        g.beginPath(); g.arc(ex, by - 26, 13, 0, Math.PI * 2); g.stroke();
        g.fillStyle = stroke; g.beginPath(); g.arc(ex, by - 26, 5, 0, Math.PI * 2); g.fill();
      }
    }
    g.beginPath(); g.ellipse(bx, by + 48, 44, 32, 0, 0, Math.PI * 2); g.stroke();
    g.fillStyle = stroke; g.beginPath(); g.arc(bx, by + 26, 9, 0, Math.PI * 2); g.fill();
    g.beginPath();
    if (mood === 'sad') g.arc(bx, by + 78, 16, Math.PI * 1.15, Math.PI * 1.85);
    else                g.arc(bx, by + 50, 18, Math.PI * 0.15, Math.PI * 0.85);
    g.stroke();
    bearSprites.set(mood, spr);
    return spr;
  }

  function drawBearBg() {
    const mood = bear.life > 0 ? bear.type : 'idle';
    const t = bear.life;                              // reaction intensity 0..1
    ctx.globalAlpha = 0.09 + t * 0.10;
    ctx.drawImage(getBearSprite(mood), 0, 0);
    ctx.globalAlpha = 1;
    if (t > 0) {                                      // live reaction halo
      ctx.save();
      ctx.globalAlpha = t * 0.12;
      ctx.strokeStyle = mood === 'sad' ? '#8ab6ff' : mood === 'happy' ? '#ffd486' : '#ff80d4';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(W / 2, H * 0.48, 130 + 16 + t * 20, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }

  // ── Aim preview (ricochet trajectory for the Aim power-up) ───────
  function drawAim() {
    if (!aim) return;
    const b = aim.b;
    let x = b.x, y = b.y;
    let vx = Math.cos(aim.angle), vy = Math.sin(aim.angle);
    const step = 7;
    const dots = [];
    let bounces = 0;
    for (let i = 0; i < 240 && bounces < 4; i++) {
      x += vx * step; y += vy * step;
      if (x < b.r)       { x = b.r;     vx = Math.abs(vx);  bounces++; }
      else if (x > W - b.r) { x = W - b.r; vx = -Math.abs(vx); bounces++; }
      if (y < b.r)       { y = b.r;     vy = Math.abs(vy);  bounces++; }
      let hitBrick = false;
      for (const br of bricks) {
        if (br.alive && x > br.x && x < br.x + br.w && y > br.y && y < br.y + br.h) { hitBrick = true; break; }
      }
      if (hitBrick) { dots.push({ x, y, hit: true }); break; }
      if (y > PADDLE_Y) break;
      if (i % 2 === 0) dots.push({ x, y, hit: false });
    }
    ctx.save();
    for (const d of dots) {
      ctx.globalAlpha = d.hit ? 0.95 : 0.5;
      ctx.fillStyle = d.hit ? '#ffe7a8' : '#ffd486';
      ctx.shadowColor = '#ffb84d';
      ctx.shadowBlur = d.hit ? 12 : 6;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.hit ? 4.5 : 2.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ── Background — static layers pre-rendered ONCE to an offscreen
  //    canvas; only the twinkling stars are drawn live each frame. ──
  function makeLayer(paint) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    paint(c.getContext('2d'));
    return c;
  }

  const bgLayer = makeLayer(g => {
    const wash = g.createLinearGradient(0, 0, 0, H);
    wash.addColorStop(0, '#1a0f2e');
    wash.addColorStop(0.5, '#120a22');
    wash.addColorStop(1, '#080510');
    g.fillStyle = wash; g.fillRect(0, 0, W, H);

    const bloom1 = g.createRadialGradient(W * 0.25, H * 0.17, 8, W * 0.25, H * 0.17, W * 0.72);
    bloom1.addColorStop(0, 'rgba(255, 120, 200, 0.16)');
    bloom1.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = bloom1; g.fillRect(0, 0, W, H);

    const bloom2 = g.createRadialGradient(W * 0.78, H * 0.32, 8, W * 0.78, H * 0.32, W * 0.62);
    bloom2.addColorStop(0, 'rgba(150, 90, 255, 0.14)');
    bloom2.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = bloom2; g.fillRect(0, 0, W, H);

    g.strokeStyle = 'rgba(180, 120, 220, 0.05)';
    g.lineWidth = 1;
    for (let x = 0; x <= W; x += 32) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (let y = 0; y <= H; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  });

  const vignetteLayer = makeLayer(g => {
    const v = g.createRadialGradient(W / 2, H * 0.45, H * 0.2, W / 2, H * 0.5, H * 0.78);
    v.addColorStop(0, 'rgba(0, 0, 0, 0)');
    v.addColorStop(1, 'rgba(5, 3, 12, 0.55)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  });

  const stars = [];
  for (let i = 0; i < 44; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.5 + Math.random() * 1.5,
                 ph: Math.random() * Math.PI * 2, sp: 0.4 + Math.random() * 1.6 });
  }

  function drawBackground() {
    ctx.drawImage(bgLayer, 0, 0);
    const t = performance.now() / 1000;
    ctx.fillStyle = '#ffd8f4';
    for (const s of stars) {
      ctx.globalAlpha = 0.12 + (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)) * 0.4;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawVignette() { ctx.drawImage(vignetteLayer, 0, 0); }

  // ── Brick sprites — rendered once per distinct look (hue/damage/bomb)
  //    with the glow baked in, then blitted each frame. ──
  const BRICK_PADPX = 10;
  const brickSprites = new Map();
  function getBrickSprite(hue, L, dmg, bomb) {
    const key = hue + '|' + L + '|' + dmg + '|' + (bomb ? 1 : 0);
    let spr = brickSprites.get(key);
    if (spr) return spr;
    const w = BRICK_W, h = BRICK_H, ox = BRICK_PADPX, oy = BRICK_PADPX;
    spr = document.createElement('canvas');
    spr.width = Math.ceil(w + BRICK_PADPX * 2);
    spr.height = Math.ceil(h + BRICK_PADPX * 2);
    const g = spr.getContext('2d');
    g.shadowColor = bomb ? 'rgba(255,140,70,0.8)' : `hsla(${hue}, 100%, 75%, 0.6)`;
    g.shadowBlur = bomb ? 12 : 8;
    const grad = g.createLinearGradient(ox, oy, ox, oy + h);
    grad.addColorStop(0, `hsl(${hue}, 88%, ${L + 12}%)`);
    grad.addColorStop(0.5, `hsl(${hue}, 76%, ${L}%)`);
    grad.addColorStop(1, `hsl(${hue}, 70%, ${L - 14}%)`);
    g.fillStyle = grad;
    g.beginPath(); g.roundRect(ox, oy, w, h, 5); g.fill();
    g.shadowBlur = 0;
    g.globalAlpha = 0.5; g.fillStyle = '#ffffff';
    g.beginPath(); g.roundRect(ox + 3, oy + 2.5, w - 6, 3.5, 2); g.fill();
    g.globalAlpha = 0.5; g.strokeStyle = `hsl(${hue}, 100%, 88%)`; g.lineWidth = 1;
    g.beginPath(); g.roundRect(ox + 0.75, oy + 0.75, w - 1.5, h - 1.5, 4.5); g.stroke();
    if (dmg > 0) {
      g.globalAlpha = 0.7; g.strokeStyle = 'rgba(20, 8, 30, 0.8)'; g.lineWidth = 1.4;
      g.beginPath();
      g.moveTo(ox + w * 0.32, oy + 3); g.lineTo(ox + w * 0.5, oy + h - 3);
      if (dmg > 1) { g.moveTo(ox + w * 0.66, oy + 2); g.lineTo(ox + w * 0.48, oy + h - 2); }
      g.stroke();
    }
    brickSprites.set(key, spr);
    return spr;
  }

  function drawOverlay() {
    let title = '', sub = '', hue = 320;
    if (state === 'idle')      { title = 'BRICK BREAKER'; sub = 'Press SPACE / tap LAUNCH'; hue = 320; }
    else if (state === 'dead') { title = 'GAME OVER';     sub = 'Score ' + score + '  ·  LAUNCH to retry'; hue = 350; }
    else return;

    ctx.save();
    ctx.fillStyle = 'rgba(8, 4, 18, 0.62)';
    ctx.fillRect(0, 0, W, H);
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 380);
    ctx.textAlign = 'center';
    ctx.fillStyle = `hsl(${hue}, 100%, 82%)`;
    ctx.shadowColor = `hsl(${hue}, 100%, 65%)`;
    ctx.shadowBlur = 18 + pulse * 14;
    ctx.font = 'bold 34px "Courier New", monospace';
    ctx.fillText(title, W / 2, H / 2 - 12);
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#b8ffea';
    ctx.shadowColor = 'rgba(100, 255, 210, 0.6)';
    ctx.font = '15px "Courier New", monospace';
    ctx.globalAlpha = 0.7 + pulse * 0.3;
    ctx.fillText(sub, W / 2, H / 2 + 24);
    ctx.restore();
  }

  // ── Active-effect chips (top-left), with countdowns for timed ones ─
  function drawEffectChips() {
    const secs = f => Math.ceil(f / 60);
    const chips = [];
    if (fx.wide > 0)   chips.push(['WIDE ' + secs(fx.wide), 155]);
    if (fx.narrow > 0) chips.push(['NARROW ' + secs(fx.narrow), 18]);
    if (fx.phase > 0)  chips.push(['PHASE ' + secs(fx.phase), 168]);
    if (fx.tiny > 0)   chips.push(['TINY ' + secs(fx.tiny), 25]);
    if (fx.shield)     chips.push(['SHIELD', 285]);
    if (fx.force)      chips.push(['SAVE', 240]);
    if (fx.sticky)     chips.push(['AIM READY', 50]);
    if (!chips.length) return;
    ctx.save();
    ctx.font = 'bold 10px Courier New';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    let yy = 11;
    for (const [label, hue] of chips) {
      const w = ctx.measureText(label).width + 12;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = `hsla(${hue}, 65%, 28%, 0.9)`;
      ctx.strokeStyle = `hsl(${hue}, 100%, 75%)`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(8, yy, w, 16, 5); ctx.fill(); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = `hsl(${hue}, 100%, 86%)`;
      ctx.fillText(label, 14, yy + 8.5);
      yy += 20;
    }
    ctx.restore();
  }

  // ── Draw ──────────────────────────────────────────────────────────
  function draw() {
    drawBackground();

    // Bear watermark is drawn outside the shake transform so it stays still
    drawBearBg();

    ctx.save();
    if (shakeFrames > 0 && !reduceMotion) {
      ctx.translate((Math.random() - 0.5) * shakeAmt, (Math.random() - 0.5) * shakeAmt);
    }

    // Bricks — blit a cached sprite; only the bomb marker animates live
    const bombPulse = 0.5 + 0.5 * Math.sin(performance.now() / 160);
    for (const b of bricks) {
      if (!b.alive) continue;
      const alpha = 0.6 + 0.4 * (b.hp / b.maxHp);
      const hue = b.bomb ? 18 : (HP_HUE[b.maxHp] || 270);
      const L = b.bomb ? 56 : 72;
      const spr = getBrickSprite(hue, L, b.maxHp - b.hp, b.bomb);
      ctx.globalAlpha = alpha;
      ctx.drawImage(spr, b.x - BRICK_PADPX, b.y - BRICK_PADPX);
      if (b.bomb) {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        ctx.fillStyle = bombPulse > 0.5 ? '#fff4c0' : '#ffd070';
        ctx.beginPath();
        for (let s = 0; s < 16; s++) {
          const a = (s / 16) * Math.PI * 2;
          const sr = s % 2 === 0 ? 6 : 3;
          const px = cx + Math.cos(a) * sr, py = cy + Math.sin(a) * sr;
          s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // Particles
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      if (p.kind === 'ring') {
        ctx.strokeStyle = `hsl(${p.hue}, 85%, 80%)`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.stroke();
      } else if (p.kind === 'spark') {
        ctx.strokeStyle = `hsl(${p.hue}, 100%, 82%)`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 3, p.y - p.vy * 3); ctx.stroke();
      } else {
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = `hsl(${p.hue}, 80%, 78%)`;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }

    // Power-ups
    for (const pu of powerups) {
      const def = PU[pu.type];
      ctx.save();
      ctx.shadowColor = `hsl(${def.hue}, 100%, 75%)`;
      ctx.shadowBlur = 10;
      ctx.fillStyle = `hsl(${def.hue}, 70%, 58%)`;
      ctx.strokeStyle = `hsl(${def.hue}, 100%, 88%)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(pu.x, pu.y, PU_W, PU_H, 5);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Courier New';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.label, pu.x + PU_W / 2, pu.y + PU_H / 2 + 1);
      ctx.restore();
    }

    // Force-field line
    if (fx.force) {
      const fy = H - 7;
      const g = ctx.createLinearGradient(0, fy, W, fy);
      g.addColorStop(0, 'transparent');
      g.addColorStop(0.5, `hsl(${FORCE_MS_HUE}, 90%, 80%)`);
      g.addColorStop(1, 'transparent');
      ctx.save();
      ctx.shadowColor = `hsl(${FORCE_MS_HUE}, 100%, 70%)`;
      ctx.shadowBlur = 16;
      ctx.strokeStyle = g; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, fy); ctx.lineTo(W, fy); ctx.stroke();
      ctx.restore();
    }

    // Shield barrier — persistent glowing line that saves one miss
    if (fx.shield) {
      const sy = H - 4;
      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 180);
      ctx.save();
      ctx.globalAlpha = 0.45 + pulse * 0.4;
      ctx.shadowColor = '#c9a8ff'; ctx.shadowBlur = 14;
      ctx.strokeStyle = '#d8c0ff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(5, sy); ctx.lineTo(W - 5, sy); ctx.stroke();
      ctx.restore();
    }

    // Paddle — pastel neon with glow + squash on impact
    const pg = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
    ctx.save();
    if (paddleHit > 0) {
      const pcx = paddle.x + paddle.w / 2, pcy = PADDLE_Y + PADDLE_H / 2;
      ctx.translate(pcx, pcy);
      ctx.scale(1 + paddleHit * 0.12, 1 - paddleHit * 0.30);
      ctx.translate(-pcx, -pcy);
    }
    if (fx.wide > 0) {
      pg.addColorStop(0, '#80ffbe'); pg.addColorStop(1, '#30d880');
      ctx.strokeStyle = '#b0ffe0';
      ctx.shadowColor = 'rgba(80, 255, 160, 0.8)';
    } else if (fx.narrow > 0) {
      pg.addColorStop(0, '#ff8aaa'); pg.addColorStop(1, '#e03060');
      ctx.strokeStyle = '#ffbbcc';
      ctx.shadowColor = 'rgba(255, 100, 140, 0.8)';
    } else {
      pg.addColorStop(0, '#e090ff'); pg.addColorStop(1, '#a030d0');
      ctx.strokeStyle = '#f0b8ff';
      ctx.shadowColor = 'rgba(200, 100, 255, 0.8)';
    }
    ctx.shadowBlur = 16;
    ctx.fillStyle = pg; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill(); ctx.stroke();
    // gloss highlight
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(paddle.x + 6, PADDLE_Y + 3, Math.max(0, paddle.w - 12), 3, 2);
    ctx.fill();
    if (paddleHit > 0) {                                // impact flash
      ctx.globalAlpha = paddleHit * 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(paddle.x, PADDLE_Y, paddle.w, PADDLE_H, 7);
      ctx.fill();
    }
    ctx.restore();

    // Balls — trail & glow tinted by the active power-up
    const fxHue = fx.phase > 0 ? 168 : fx.tiny > 0 ? 25 : 318;
    const trailCol = `hsl(${fxHue}, 100%, 75%)`;
    const coreCol  = fx.phase > 0 ? '#9affe0' : fx.tiny > 0 ? '#ffd0bf' : '#f0a8ff';
    for (const b of balls) {
      const n = b.trail.length;
      for (let t = 0; t < n; t++) {
        const f = (t + 1) / n;
        ctx.globalAlpha = f * (fx.phase > 0 ? 0.26 : 0.18);
        ctx.fillStyle = trailCol;
        ctx.beginPath();
        ctx.arc(b.trail[t].x, b.trail[t].y, b.r * (0.35 + 0.5 * f), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.shadowColor = trailCol;
      ctx.shadowBlur = 16;
      ctx.globalAlpha = fx.phase > 0 ? 0.7 : 1;        // phase ball is translucent
      const g = ctx.createRadialGradient(b.x - 2, b.y - 2, 1, b.x, b.y, b.r);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(1, coreCol);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Aim trajectory preview
    drawAim();

    // Floating score / combo text
    for (const f of floaters) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.3));
      ctx.fillStyle = `hsl(${f.hue}, 100%, 80%)`;
      ctx.shadowColor = `hsl(${f.hue}, 100%, 70%)`;
      ctx.shadowBlur = 8;
      ctx.font = 'bold 14px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    // Combo meter
    if (combo >= 2 && state === 'playing') {
      ctx.save();
      ctx.globalAlpha = 0.92;
      ctx.fillStyle = '#ffe7a8';
      ctx.shadowColor = '#ffb84d'; ctx.shadowBlur = 10;
      ctx.font = 'bold 17px Courier New';
      ctx.textAlign = 'right';
      ctx.fillText('COMBO x' + combo, W - 10, 26);
      ctx.restore();
    }

    if (state === 'playing' || state === 'ready') drawEffectChips();

    ctx.restore();

    // Vignette + start/game-over splash sit above everything, steady (no shake)
    drawVignette();
    drawOverlay();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ── HUD / messages ────────────────────────────────────────────────
  function updateHUD() {
    document.getElementById('scoreEl').textContent = score;
    document.getElementById('levelEl').textContent = level;
    document.getElementById('livesEl').textContent = Math.max(0, lives);
  }
  function showMsg(m) { document.getElementById('message').textContent = m; }
  function clearMsg() { document.getElementById('message').textContent = ''; }
  function updateGoBtn() {
    const btn = document.getElementById('btnGo');
    if (state === 'dead') btn.textContent = 'RESTART';
    else if (state === 'playing') btn.textContent = '·····';
    else btn.textContent = 'LAUNCH';
  }

  // ── Input ─────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); launch(); }
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  function canvasX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    pointerKind = e.pointerType || 'mouse';
    pointerX = canvasX(e);
    if (pointerKind === 'touch') {
      // Grab the paddle directly only if the finger landed on it
      if (pointerX >= paddle.x && pointerX <= paddle.x + paddle.w) {
        dragging = true; grabOffset = pointerX - paddle.x;
      } else {
        dragging = false;
      }
    }
    launch();
  });
  canvas.addEventListener('pointermove', e => {
    e.preventDefault();
    pointerKind = e.pointerType || pointerKind;
    pointerX = canvasX(e);
  });
  canvas.addEventListener('pointerup', e => {
    dragging = false;
    if ((e.pointerType || 'mouse') === 'touch') pointerX = null;  // stop gliding on lift
  });
  canvas.addEventListener('pointerleave', () => { pointerX = null; dragging = false; });

  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const btnGo = document.getElementById('btnGo');

  function hold(key, down) { keys[key] = down; }
  btnLeft.addEventListener('pointerdown',  e => { e.preventDefault(); hold('ArrowLeft', true); });
  btnLeft.addEventListener('pointerup',    e => { e.preventDefault(); hold('ArrowLeft', false); });
  btnLeft.addEventListener('pointerleave', () => hold('ArrowLeft', false));
  btnRight.addEventListener('pointerdown',  e => { e.preventDefault(); hold('ArrowRight', true); });
  btnRight.addEventListener('pointerup',    e => { e.preventDefault(); hold('ArrowRight', false); });
  btnRight.addEventListener('pointerleave', () => hold('ArrowRight', false));
  btnGo.addEventListener('pointerdown', e => { e.preventDefault(); launch(); });

  // Sound toggle
  const btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', () => {
    soundOn = !soundOn;
    btnSound.innerHTML = soundOn ? '&#9834; ON' : '&#9834; OFF';
    btnSound.classList.toggle('off', !soundOn);
    if (soundOn) playTone(660, 0.08, 'triangle');
  });

  // Resume audio on first gesture (browser autoplay policy)
  function resumeAudio() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  document.addEventListener('pointerdown', resumeAudio);
  document.addEventListener('keydown', resumeAudio);

  // ── Boot ──────────────────────────────────────────────────────────
  startGame();
  state = 'idle';
  showMsg('Press SPACE or tap LAUNCH to start');
  loop();
  </script>
</body>
</html>
